services:
  localstack:
    image: localstack/localstack:4.14.0
    hostname: localstack
    ports:
      - "24566:4566"
    environment:
      SERVICES: dynamodb,dynamodbstreams
      DEBUG: "0"
      DEFAULT_REGION: ap-northeast-1
      DYNAMODB_SHARE_DB: "1"
      DYNAMODB_IN_MEMORY: "1"
      HOSTNAME_EXTERNAL: localstack
    volumes:
      # LocalStack v4 wipes /tmp/localstack on startup, so it cannot be a bind mount.
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:26.10
    hostname: mysql-local
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci
    ports:
      - "23306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: ceer
      MYSQL_PASSWORD: ceer
      MYSQL_DATABASE: cqrs_es_example
    healthcheck:
      test: MYSQL_PWD=password mysql -h127.0.0.1 -P3306 -uroot -e "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 30

  migration:
    image: migrate/migrate:v4.20.1
    volumes:
      - ../migrate/migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path
      - /migrations
      - -database
      - mysql://ceer:ceer@tcp(mysql-local:3306)/cqrs_es_example
    command: ["up"]
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  dynamodb-setup:
    image: mesosphere/aws-cli
    environment:
      AWS_ACCESS_KEY_ID: x
      AWS_SECRET_ACCESS_KEY: x
      AWS_REGION: ap-northeast-1
      AWS_DEFAULT_REGION: ap-northeast-1
      DYNAMODB_ENDPOINT: localstack:4566
      JOURNAL_TABLE_NAME: cqrs-es-example-journal
      SNAPSHOT_TABLE_NAME: cqrs-es-example-snapshot
      HEAD_TABLE_NAME: cqrs-es-example-head
      SNAPSHOT_HISTORY_INDEX_NAME: snapshot-active-history-index
      STORE_ID: 00000000-0000-4000-8000-000000000000
    volumes:
      - ../dynamodb-setup:/setup:ro
    entrypoint: [""]
    command: ["/setup/create-tables.sh"]
    depends_on:
      localstack:
        condition: service_healthy
    restart: "no"
