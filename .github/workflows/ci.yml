name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # Changing the base branch emits edited without changing the head SHA.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  revision:
    name: Verify PR test merge
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - name: Resolve a test merge with the event's base and head
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          sha_pattern='^[0-9a-f]{40}$'
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ || ! "$BASE_SHA" =~ $sha_pattern || ! "$HEAD_SHA" =~ $sha_pattern ]]; then
            echo "::error::The pull request event is missing a valid number, base SHA, or head SHA."
            exit 1
          fi

          echo "Event merge: $GITHUB_SHA; expected parents: $BASE_SHA $HEAD_SHA"
          candidate="$GITHUB_SHA"
          # After a base edit the event SHA and merge ref can still be stale.
          for delay in 0 2 4 8 15 30; do
            if (( delay > 0 )); then
              sleep "$delay"
              candidate=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/pull/$PR_NUMBER/merge" --jq '.object.sha') || continue
            fi
            [[ "$candidate" =~ $sha_pattern ]] || continue
            parents=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$candidate" --jq '[.parents[].sha] | join(" ")') || continue
            echo "Candidate: $candidate; parents: $parents"
            if [[ "$parents" == "$BASE_SHA $HEAD_SHA" ]]; then
              echo "Verified test merge: $candidate"
              echo "sha=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "::error::No test merge matched the pull request event's base and head."
          exit 1

  lint:
    name: lint
    needs: revision
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - &require-revision
        name: Require a verified PR revision
        if: ${{ github.event_name == 'pull_request' && (needs.revision.result != 'success' || needs.revision.outputs.sha == '') }}
        run: |
          echo "::error::No verified PR test merge is available."
          exit 1
      - &checkout-revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.sha }}
      - uses: coursier/setup-action@v1
        with:
          jvm: temurin:17
          apps: sbt
      - uses: coursier/cache-action@v6
      - run: sbt -batch lint

  deploy-assets:
    name: deploy-assets
    needs: revision
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - *require-revision
      - *checkout-revision
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Lint the CloudFormation template and the scripts
        run: |
          pip install cfn-lint
          cfn-lint deploy/rmu-deployment.template.json
          python3 -m json.tool deploy/parameters.example.json > /dev/null
          bash -n deploy/apply-rmu-deployment.sh
          bash -n deploy/build-lambda-package.sh
          bash -n deploy/measure-lambda-package.sh
      - uses: coursier/setup-action@v1
        with:
          jvm: temurin:17
          apps: sbt
      - uses: coursier/cache-action@v6
      - name: Build the Lambda package
        run: sbt -batch lambda/assembly
      - name: Report the Lambda package size and dependency list
        run: ./deploy/measure-lambda-package.sh
      - name: Check the Lambda package
        run: |
          JAR="$(find modules/lambda/target -name cqrs-es-example-scala-lambda.jar -print -quit)"
          unzip -l "$JAR" | grep -F 'scala/lambda/LambdaReadModelUpdater.class'
          unzip -l "$JAR" | grep -F 'scala/lambda/LambdaRecoveryWorker.class'
          unzip -l "$JAR" | grep -F 'scala/lambda/LambdaResyncWorker.class'

  test:
    name: test
    needs: revision
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - *require-revision
      - *checkout-revision
      - uses: coursier/setup-action@v1
        with:
          jvm: temurin:17
          apps: sbt
      - uses: coursier/cache-action@v6
      - run: sbt -batch test

  e2e:
    name: e2e
    needs: revision
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - *require-revision
      - *checkout-revision
      - name: Run docker compose e2e against LocalStack
        run: ./tools/scripts/docker-compose-e2e-test.sh

  aislop:
    name: aislop
    needs: revision
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - *require-revision
      - *checkout-revision
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:aislop
      - run: npm run test:aislop

  required:
    name: CI required
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [revision, lint, test, e2e, deploy-assets, aislop]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful verification and CI jobs
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            map_values(.result) | debug
            | [.revision, .lint, .test, .e2e, .["deploy-assets"], .aislop]
            | all(. == "success")
          ' <<< "$CI_RESULTS"
