name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/setup-action@v1
        with:
          jvm: temurin:17
          apps: sbt
      - uses: coursier/cache-action@v6
      - run: sbt -batch lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/setup-action@v1
        with:
          jvm: temurin:17
          apps: sbt
      - uses: coursier/cache-action@v6
      - run: sbt -batch test

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run docker compose e2e against LocalStack
        run: ./tools/scripts/docker-compose-e2e-test.sh
