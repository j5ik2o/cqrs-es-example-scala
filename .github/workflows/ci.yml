name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # Changing the base branch emits edited without changing the head SHA.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  revision:
    name: Verify PR test merge
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ref: ${{ steps.resolve.outputs.checkout_ref }}
      test_merge: ${{ steps.resolve.outputs.test_merge }}
      bundle: ${{ steps.resolve.outputs.bundle_name }}
    steps:
      # Load the resolver from the revision that defines this workflow; a PR
      # branch that predates it does not have the script.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test the test merge resolution
        run: node --test .github/scripts/pr-test-merge.test.mjs
      # Check the current base tip and PR head, not the event's base SHA.
      - name: Resolve the PR's test merge
        id: resolve
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/pr-test-merge.sh
      - uses: actions/upload-artifact@v4
        if: ${{ steps.resolve.outputs.bundle_name != '' }}
        with:
          name: ${{ steps.resolve.outputs.bundle_name }}
          path: ${{ runner.temp }}/pr-test-merge.bundle
          if-no-files-found: error
          # After expiry, re-run all jobs so this job builds the bundle again.
          retention-days: 1

  lint:
    name: lint
    needs: revision
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - &checkout-revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.revision.outputs.ref }}
          # The bundle of a locally built test merge needs the base history.
          fetch-depth: ${{ needs.revision.outputs.bundle != '' && '0' || '1' }}
      - &download-test-merge
        uses: actions/download-artifact@v4
        if: ${{ needs.revision.outputs.bundle != '' }}
        with:
          name: ${{ needs.revision.outputs.bundle }}
          path: ${{ runner.temp }}/pr-test-merge
      - &verify-test-merge
        name: Verify the checked out test merge
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          TEST_MERGE: ${{ needs.revision.outputs.test_merge }}
          BUNDLE: ${{ needs.revision.outputs.bundle }}
        run: |
          if [[ -n "$BUNDLE" ]]; then
            git fetch --quiet --no-tags "$RUNNER_TEMP/pr-test-merge/pr-test-merge.bundle" refs/pr-ci/merge
            git checkout --quiet --detach FETCH_HEAD
          fi
          # A shallow checkout hides parents from %P; the commit object keeps them.
          actual="$(git rev-parse HEAD)$(git cat-file commit HEAD | awk '!NF { exit } $1 == "parent" { printf " %s", $2 }')"
          printf 'Checked out test merge (SHA, base, head): %s\n' "$actual"
          if [[ -z "$TEST_MERGE" || "$actual" != "$TEST_MERGE" ]]; then
            printf '::error::Expected test merge %s\n' "${TEST_MERGE:-missing}"
            exit 1
          fi
      - uses: coursier/setup-action@v1
        with:
          jvm: temurin:17
          apps: sbt
      - uses: coursier/cache-action@v6
      - run: sbt -batch lint

  deploy-assets:
    name: deploy-assets
    needs: revision
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - *checkout-revision
      - *download-test-merge
      - *verify-test-merge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Lint the CloudFormation template and the scripts
        run: |
          pip install cfn-lint
          cfn-lint deploy/rmu-deployment.template.json
          python3 -m json.tool deploy/parameters.example.json > /dev/null
          bash -n deploy/apply-rmu-deployment.sh
          bash -n deploy/build-lambda-package.sh
          bash -n deploy/measure-lambda-package.sh
      - uses: coursier/setup-action@v1
        with:
          jvm: temurin:17
          apps: sbt
      - uses: coursier/cache-action@v6
      - name: Build the Lambda package
        run: sbt -batch lambda/assembly
      - name: Report the Lambda package size and dependency list
        run: ./deploy/measure-lambda-package.sh
      - name: Check the Lambda package
        run: |
          JAR="$(find modules/lambda/target -name cqrs-es-example-scala-lambda.jar -print -quit)"
          unzip -l "$JAR" | grep -F 'scala/lambda/LambdaReadModelUpdater.class'
          unzip -l "$JAR" | grep -F 'scala/lambda/LambdaRecoveryWorker.class'
          unzip -l "$JAR" | grep -F 'scala/lambda/LambdaResyncWorker.class'

  test:
    name: test
    needs: revision
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - *checkout-revision
      - *download-test-merge
      - *verify-test-merge
      - uses: coursier/setup-action@v1
        with:
          jvm: temurin:17
          apps: sbt
      - uses: coursier/cache-action@v6
      - run: sbt -batch test

  e2e:
    name: e2e
    needs: revision
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - *checkout-revision
      - *download-test-merge
      - *verify-test-merge
      - name: Run docker compose e2e against LocalStack
        run: ./tools/scripts/docker-compose-e2e-test.sh

  aislop:
    name: aislop
    needs: revision
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - *checkout-revision
      - *download-test-merge
      - *verify-test-merge
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:aislop
      - run: npm run test:aislop

  required:
    # An off-main run for the same head must not publish the main check name.
    name: ${{ github.base_ref == 'main' && 'CI required' || 'CI summary' }}
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [revision, lint, test, e2e, deploy-assets, aislop]
    runs-on: ubuntu-latest
    steps:
      - name: Require successful verification and CI jobs
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            map_values(.result) | debug
            | [.revision, .lint, .test, .e2e, .["deploy-assets"], .aislop]
            | all(. == "success")
          ' <<< "$CI_RESULTS"
