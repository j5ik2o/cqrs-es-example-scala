name: CI

on:
  push:
    branches:
      - main
  pull_request:
    # Changing the base branch emits edited without changing the head SHA.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  deploy-assets:
    name: deploy-assets
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: "true"

  aislop:
    name: aislop
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - run: "true"

  required:
    name: CI required
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: [lint, test, e2e, deploy-assets, aislop]
    runs-on: ubuntu-latest
    steps:
      - name: Require all five CI jobs to succeed
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e '
            map_values(.result) | debug
            | [.lint, .test, .e2e, .["deploy-assets"], .aislop]
            | all(. == "success")
          ' <<< "$CI_RESULTS"
